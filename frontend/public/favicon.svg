<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Vibrant neon emerald-to-teal stroke gradient -->
    <linearGradient id="emeraldTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#39E98A" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow effect filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="glowBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39E98A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle ambient inner glow -->
  <circle cx="64" cy="64" r="42" fill="url(#glowBack)" filter="url(#neonGlow)" opacity="0.6" />

  <!-- Glowing Icon Graphic: Stylized 'M' with Rising 'Way' Arrow -->
  <g filter="url(#neonGlow)">
    <!-- Outer 'M' Legs & Arches -->
    <path 
      d="M26 94 V48 C26 38 34 32 44 32 C54 32 60 38 64 46 C68 38 74 32 84 32 C94 32 102 38 102 48 V94" 
      fill="none" 
      stroke="url(#emeraldTeal)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.45"
    />

    <!-- Inner Path (M-core) -->
    <path 
      d="M38 94 V54 C38 48 42 44 48 44 C54 44 59 48 64 56 C69 48 74 44 80 44 C86 44 90 48 90 54 V94" 
      fill="none" 
      stroke="url(#emeraldTeal)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.3"
    />

    <!-- Dynamic Rising Arrow ("Way" upward career trend) -->
    <path 
      d="M24 88 L52 60 L68 74 L102 30" 
      fill="none" 
      stroke="url(#emeraldTeal)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Arrowhead at (102, 30) pointing up-right -->
    <polygon 
      points="104,18 78,28 92,42" 
      fill="url(#emeraldTeal)" 
      stroke="url(#emeraldTeal)" 
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Base anchor dots/lines -->
    <line x1="22" y1="96" x2="38" y2="96" stroke="url(#emeraldTeal)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="90" y1="96" x2="106" y2="96" stroke="url(#emeraldTeal)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>